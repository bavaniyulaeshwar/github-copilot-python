<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <main>
    <div id="sudoku-board" role="grid" aria-label="Sudoku puzzle"></div>
  </main>
  <div class="controls">
    <button id="new-game" type="button">New Game</button>
    <button id="check-solution" type="button">Check Solution</button>
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <span id="message" aria-live="polite"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Scores</h2>
    <ol id="leaderboard-list"></ol>
  </section>
  <script src="/static/leaderboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
